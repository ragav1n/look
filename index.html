         never runs the app's JS, so whatever sits here is the whole preview.
         Product pages get their own photo and price swapped in by
         middleware.ts before the HTML is served; these are the fallback for
         every other page. The markers are what middleware.ts replaces —
         keep them. -->
    <!--og:start-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOOK" />
    <meta property="og:title" content="LOOK | Premium Women's Fashion for Every Occasion" />

      property="og:description"
      content="Discover premium western wear, dresses, coord sets and elevated everyday essentials crafted for confidence, comfort and timeless elegance. Thoughtfully designed for every woman."
    />
    <meta property="og:url" content="https://look.ind.in/" />
    <meta property="og:image" content="https://look.ind.in/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LOOK — modern western essentials" />
    <meta name="twitter:card" content="summary_large_image" />
